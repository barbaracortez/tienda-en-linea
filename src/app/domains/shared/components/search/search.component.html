<form role="search" class="relative w-full md:w-72" (ngSubmit)="search()">
  <label for="product-search" class="sr-only">Buscar productos</label>
  <svg
    class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-500"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 20 20">
    <path
      stroke="currentColor"
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="2"
      d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z" />
  </svg>
  <input
    id="product-search"
    type="search"
    [formControl]="query"
    autocomplete="off"
    placeholder="Buscar productos…"
    class="block w-full rounded-lg border border-nightBorder bg-nightLight py-2 pl-9 pr-3 text-sm text-slate-100 placeholder:text-slate-500 focus:border-accent" />
</form>
