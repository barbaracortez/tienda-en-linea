<form role="search" class="relative w-full md:w-64" (ngSubmit)="search()">
  <label for="product-search" class="sr-only">Buscar productos</label>
  <svg
    class="pointer-events-none absolute left-4 top-1/2 h-4 w-4 -translate-y-1/2 text-fg-subtle"
    aria-hidden="true"
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
  </svg>
  <input
    id="product-search"
    type="search"
    [formControl]="query"
    autocomplete="off"
    placeholder="Buscar"
    class="block w-full rounded-full border border-line-field bg-surface py-2 pl-10 pr-4 text-sm text-fg placeholder:text-fg-subtle transition-colors focus:border-gold" />
</form>
