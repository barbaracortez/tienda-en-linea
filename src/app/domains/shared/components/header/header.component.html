<header
  class="sticky top-0 z-30 border-b border-nightBorder bg-night/90 backdrop-blur">
  <nav
    class="container mx-auto flex flex-wrap items-center gap-4 px-4 py-3"
    aria-label="Navegación principal">
    <button
      type="button"
      class="icon-btn md:hidden"
      (click)="toggleMenu()"
      aria-controls="main-menu"
      [attr.aria-expanded]="menuOpen()">
      <span class="sr-only">{{
        menuOpen() ? 'Cerrar menú' : 'Abrir menú'
      }}</span>
      <svg
        class="h-5 w-5"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 17 14">
        <path
          stroke="currentColor"
          stroke-linecap="round"
          stroke-width="2"
          d="M1 1h15M1 7h15M1 13h15" />
      </svg>
    </button>

    <a routerLink="/" class="text-xl font-bold tracking-tight text-white">
      Ng<span class="text-accent-light">Store</span>
    </a>
    <span
      class="rounded-full border border-amber-400/30 bg-amber-400/10 px-2 py-0.5 text-xs font-medium text-amber-200"
      title="Proyecto de portfolio: los productos y las compras son de ejemplo">
      Proyecto demo<span class="hidden lg:inline"> · datos de ejemplo</span>
    </span>

    <div
      id="main-menu"
      class="order-last w-full flex-col gap-4 md:order-none md:flex md:w-auto md:flex-1 md:flex-row md:items-center"
      [class.flex]="menuOpen()"
      [class.hidden]="!menuOpen()">
      <ul class="flex flex-col gap-1 md:flex-row md:gap-2">
        @for (link of links; track link.path) {
          <li>
            <a
              [routerLink]="link.path"
              routerLinkActive="!text-white bg-nightLight"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: link.exact }"
              class="block rounded-lg px-3 py-2 text-sm font-medium text-slate-400 transition-colors hover:text-white"
              >{{ link.label }}</a
            >
          </li>
        }
      </ul>
      <app-search class="md:ml-auto" />
    </div>

    <button
      type="button"
      class="icon-btn relative ml-auto md:ml-0"
      (click)="openCart()"
      aria-controls="cart-drawer">
      <span class="sr-only">Abrir carrito ({{ cartCount() }} productos)</span>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="h-6 w-6"
        aria-hidden="true">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
      </svg>
      @if (cartCount() > 0) {
        <span
          class="absolute -right-1 -top-1 flex h-5 min-w-5 items-center justify-center rounded-full bg-accent px-1 text-xs font-semibold text-white"
          aria-hidden="true">
          {{ cartCount() }}
        </span>
      }
    </button>
  </nav>
</header>
