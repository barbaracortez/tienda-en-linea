@let item = product();

<article
  class="group flex h-full flex-col overflow-hidden rounded-xl border border-nightBorder bg-nightLight transition hover:-translate-y-0.5 hover:border-slate-500 hover:shadow-soft">
  <a
    [routerLink]="['/product', item.slug]"
    class="block aspect-square overflow-hidden bg-night"
    tabindex="-1"
    aria-hidden="true">
    <img
      appImgFallback
      [src]="item.images[0]"
      [alt]="item.title"
      loading="lazy"
      class="h-full w-full object-cover transition duration-300 group-hover:scale-105" />
  </a>

  <div class="flex flex-1 flex-col gap-1 p-4">
    <p class="text-xs font-medium uppercase tracking-wider text-slate-500">
      {{ item.category.name }}
    </p>
    <h3 class="line-clamp-2 text-sm font-medium text-slate-100">
      <a [routerLink]="['/product', item.slug]" class="hover:text-accent">{{
        item.title
      }}</a>
    </h3>
    <p class="mt-auto pt-2 text-lg font-semibold text-white">
      {{ item.price | currency }}
    </p>
    <button
      type="button"
      class="btn-secondary mt-2 w-full"
      (click)="addToCartHandler()">
      Agregar al carrito
    </button>
  </div>
</article>
